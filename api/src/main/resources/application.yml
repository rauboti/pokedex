spring:
  application:
    name: pokedex
  datasource:
    # Standalone dev connects to pokedex-db's published host port; containers override via env.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5437/pokedex}
    username: ${POSTGRES_USER:pokedex}
    password: ${POSTGRES_PASSWORD:pokedex_local_dev}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      # Render Spring's built-in MVC exceptions as problem+json, uniform with our own handlers.
      enabled: true

pokedex:
  hive:
    # external = browser-reachable + expected token `iss`; internal = server-side calls.
    external-url: ${HIVE_EXTERNAL_URL:http://localhost:5000}
    internal-url: ${HIVE_INTERNAL_URL:http://localhost:5000}
    client-id: ${HIVE_CLIENT_ID:pokedex}
    client-secret: ${HIVE_CLIENT_SECRET:}
  gamedata:
    # Full feed is `{base-url}/api/pokedex.json`. Only used by live syncs; tests stub the client.
    base-url: ${GAMEDATA_BASE_URL:https://pokemon-go-api.github.io/pokemon-go-api}
    sync-on-startup: ${GAMEDATA_SYNC_ON_STARTUP:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3050}
  web:
    # Defines the OAuth redirect URI as `{base-url}/auth/callback`. Dev default is the Vite origin.
    base-url: ${WEB_BASE_URL:http://localhost:5173}

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: POKEDEX_SESSION
        # This cookie is the only client-side auth handle: HttpOnly (no JS access) and
        # SameSite=Lax (CSRF-resistant, but survives the top-level redirect back from hive).
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
