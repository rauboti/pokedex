# Dev profile: verbose logging and the local-dev hive client secret. docker-compose sets
# SPRING_PROFILES_ACTIVE=dev; the default profile stays quiet.
logging:
  level:
    no.rauboti.pokedex: DEBUG

pokedex:
  hive:
    # Matches the secret seeded for the `pokedex` app in hive's dev data. Local-dev only —
    # real environments inject HIVE_CLIENT_SECRET.
    client-secret: pokedex-local-dev
