# Test profile: integration tests get their datasource from a throwaway Testcontainers Postgres
# via @ServiceConnection, so none is set here. Flyway applies the schema; tests insert their own rows.
spring:
  flyway:
    enabled: true

pokedex:
  gamedata:
    # The suite must never reach the network — the game-data client is stubbed per test.
    sync-on-startup: false
