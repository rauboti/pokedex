server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No trailing slash on proxy_pass, so the /api prefix is preserved.
    location /api/ {
        proxy_pass http://pokedex-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The BFF OAuth endpoints sit at the root, not under /api. They must be proxied too —
    # otherwise these full-page navigations fall through to the SPA and render a 404.
    location /auth/ {
        proxy_pass http://pokedex-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed filenames — safe to cache forever. Matched before `location /`, so these
    # escape the no-cache document policy below.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # `always` so headers are sent on error responses too. Proxied /api/ responses are the
        # backend's to own. No Content-Security-Policy yet: a strict one needs the inline
        # anti-FOUC script's hash kept in sync, deferred to its own task.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # The entry document is always revalidated, so a redeploy's new /assets hashes are
        # picked up instead of the browser silently running an old bundle.
        add_header Cache-Control "no-cache" always;

        try_files $uri $uri/ /index.html;
    }
}
